<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome | The Forty-Seven</title>
<meta name="theme-color" content="#ECECEC">

<link rel="icon" type="image/png" href="enso.png">
<link rel="apple-touch-icon" href="enso.png">

<style>
:root {
    --background: #ECECEC;
    --black: #0A0A0A;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: var(--background);
    color: var(--black);
    font-family: Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

.enso {
    width: clamp(120px, 18vw, 260px);
    height: auto;
    margin-bottom: 54px;
}

.title {
    font-size: 22px;
    letter-spacing: 0.08em;
    margin-bottom: 18px;
}

.text {
    font-size: 14px;
    letter-spacing: 0.1em;
}

</style>
</head>

<body>

<div class="wrapper">
    <img src="enso.png" alt="The Forty-Seven" class="enso">

    <div class="title">Welcome.</div>
    <div class="text">You have entered the path.</div>
</div>

</body>
</html>
