<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Forty-Seven</title>

    <meta name="description" content="The Forty-Seven">
    <meta name="theme-color" content="#ECECEC">

    <link rel="icon" type="image/png" href="enso.png">

    <style>

        :root {
            --background: #ECECEC;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: var(--background);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .enso {
            width: clamp(120px, 18vw, 260px);
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            opacity: 1;
        }

    </style>

</head>

<body>

    <img
        src="enso.png"
        alt="The Forty-Seven"
        class="enso"
    >

</body>

</html>
