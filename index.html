<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Forty-Seven</title>

    <meta name="description" content="The Forty-Seven">
    <meta name="theme-color" content="#ECECEC">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="enso.png">
    <link rel="apple-touch-icon" href="enso.png">

    <style>

        :root {
            --background: #ECECEC;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: var(--background);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        img {
            width: min(65vw, 65vh);
            height: auto;
            display: block;
            user-select: none;
            pointer-events: none;
        }

    </style>

</head>

<body>

    <img src="enso.png" alt="Ensō">

</body>

</html>
